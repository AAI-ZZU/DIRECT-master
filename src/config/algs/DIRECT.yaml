# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 500000 # 500000 for 6h_vs_8z

#runner: "episode"
runner: "parallel"
#batch_size_run: 1
batch_size_run: 8 # batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
buffer_size: 5000
batch_size: 128

t_max: 5000000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "t_mac"
agent: "t_rnn"
agent_output_type: q

learner: "t_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # Learning rate for agents
td_lambda: 0.3 # 0.3 for 6h_vs_8z
optimizer: 'adam'
q_lambda: False

# rnn layer normalization
use_layer_norm: False

# orthogonal init for DNN
use_orthogonal: False
gain: 0.005

# Priority experience replay
use_per: False
per_alpha: 0.6
per_beta: 0.4
return_priority: False

# action_latent_dim: 20
n_layers: 1
name: "intent"

# intention_module
intention_dim: 64
intention_hidden_dim: 128
entity_dim: 50
horizon: 3
state_latent_dim: 32
action_spaces_update: 5000
action_latent_dim: 20

hyper_layers_num: 2
qmix_hidden_dim: 32

gamma: 0.99
